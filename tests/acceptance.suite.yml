# Codeception Acceptance Suite Configuration
#
# Runs against the self-contained test image: PHP built-in server (driven by
# BuiltInServerController) serving public/, SQLite via the
# sqlite-database-integration drop-in, and a local chromedriver (driven by
# ChromeDriverController).

actor: AcceptanceTester
modules:
    enabled:
        - Asserts
        - WPDb
        - WPWebDriver
        - WooCommerceDb
        - WooCommerceWebDriver
        - \Aztec\WPBrowser\Tests\Support\Helper\Acceptance
    config:
        WPDb:
            dsn: 'sqlite:%DB_PATH%'
            user: ''
            password: ''
            populate: true
            cleanup: true
            dump: tests/_data/dump.sql
            url: '%WP_URL%'
            urlReplacement: false
            tablePrefix: '%DB_TABLE_PREFIX%'
        WPWebDriver:
            url: '%WP_URL%'
            browser: chrome
            host: '%CHROMEDRIVER_HOST%'
            port: '%CHROMEDRIVER_PORT%'
            path: '/'
            window_size: 1200x800
            adminUsername: '%WP_ADMIN_USER%'
            adminPassword: '%WP_ADMIN_PASSWORD%'
            adminPath: /wp/wp-admin
            capabilities:
                goog:chromeOptions:
                    # NetworkServiceInProcess: Chromium 102 (PHP 8.0 image) crashes its
                    # out-of-process network service at startup in ~5% of sessions, and
                    # session creation then hangs until chromedriver's 600s timeout.
                    args:
                        - '--headless=new'
                        - '--disable-gpu'
                        - '--no-sandbox'
                        - '--disable-dev-shm-usage'
                        - '--enable-features=NetworkServiceInProcess'
        AztecWPBrowser:
            pageObjects: []
step_decorators:
    - \Codeception\Step\ConditionalAssertion
    - \Codeception\Step\TryTo
    - \Codeception\Step\Retry
