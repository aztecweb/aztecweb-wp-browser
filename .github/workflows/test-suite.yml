name: Test suite

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.env.example'
      - 'resources/**'
      - '.github/workflows/test-suite.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.env.example'
      - 'resources/**'
      - '.github/workflows/test-suite.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.0'
          - '8.4'
    container:
      image: ghcr.io/aztecweb/aztecweb-wp-browser-runner:php${{ matrix.php_version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer update --no-progress --prefer-dist

      - name: Bootstrap WordPress test site
        run: bash resources/install.sh

      - name: Build Codeception actor classes
        run: vendor/bin/codecept build

      - name: Run test suite
        run: vendor/bin/codecept run
