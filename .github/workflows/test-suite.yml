name: Test suite

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.env.example'
      - 'resources/**'
      - '.github/workflows/test-suite.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.env.example'
      - 'resources/**'
      - '.github/workflows/test-suite.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.0'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php_version }}
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php_version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php_version }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress

      - name: Run unit suite
        run: vendor/bin/codecept run unit

  acceptance:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.0'
          - '8.4'
    container:
      image: ghcr.io/aztecweb/aztecweb-wp-browser-runner:php${{ matrix.php_version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer update --no-progress --prefer-dist

      - name: Bootstrap WordPress test site
        run: bash resources/install.sh

      - name: Build Codeception actor classes
        run: vendor/bin/codecept build

      - name: Run acceptance suite
        run: vendor/bin/codecept run
