name: Build test runner image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-test-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-runner

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.0'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve content version
        id: content_version
        run: echo "value=v$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:php${{ matrix.php_version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.content_version.outputs.value }}-php${{ matrix.php_version }}
          cache-from: type=gha,scope=test-runner-php${{ matrix.php_version }}
          cache-to: type=gha,mode=max,scope=test-runner-php${{ matrix.php_version }}
