name: Build test runner image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'composer.json'
      - 'composer.lock'
      - 'public/index.php'
      - 'public/wp-config.php'
      - '.github/workflows/build-test-runner.yml'
  workflow_dispatch:
    inputs:
      content_version:
        description: 'Content version tag (e.g. v2026.05). Defaults to YYYY.MM when blank.'
        required: false
        default: ''
  schedule:
    # Weekly Monday 04:17 UTC so WordPress/WooCommerce updates land in the image.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-test-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-test-runner

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version:
          - '8.0'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve content version
        id: content_version
        run: |
          requested='${{ github.event.inputs.content_version }}'
          if [ -n "$requested" ]; then
            echo "value=$requested" >> "$GITHUB_OUTPUT"
          else
            echo "value=v$(date -u +%Y.%m)" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image name
        id: image
        run: |
          name="${IMAGE_NAME,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:php${{ matrix.php_version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.content_version.outputs.value }}-php${{ matrix.php_version }}
          cache-from: type=gha,scope=test-runner-php${{ matrix.php_version }}
          cache-to: type=gha,mode=max,scope=test-runner-php${{ matrix.php_version }}
