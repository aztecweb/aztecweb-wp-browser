name: Build test runner image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

# Minimum permissions. `id-token: write` is required for OIDC-backed
# signing of the build provenance attestation; `attestations: write`
# is required to upload that attestation to the GHCR package.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-test-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-runner

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.0 Chromium is pinned: Alpine 3.16 is EOL with no upstream updates.
        # PHP 8.4 Chromium floats: picks latest from Alpine on each rebuild.
        # Verify Chromium availability with:
        # `docker run --rm php:<ver>-cli-alpine sh -c 'apk update; apk policy chromium'`.
        include:
          - php_version: '8.0'
            chromium_version: '102.0.5005.182-r0'
          - php_version: '8.4'
            chromium_version: ''
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve content version
        id: content_version
        run: echo "value=v$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Select build cache backend
        id: cache
        run: |
          if [ -n "${ACT:-}" ]; then
            # act's cache server is incompatible with buildx's gha exporter
            # (nektos/act#1916), so disable the cache backend under act. Layer
            # reuse instead comes from the host docker daemon's own build cache
            # (see the act-skipped "Set up Docker Buildx" step below).
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "to=" >> "$GITHUB_OUTPUT"
          else
            echo "from=type=gha,scope=test-runner-php${{ matrix.php_version }}" >> "$GITHUB_OUTPUT"
            echo "to=type=gha,mode=max,scope=test-runner-php${{ matrix.php_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        # Skipped under act: the container-driver builder's cache is discarded
        # on cleanup, so its layers wouldn't survive between local runs. Without
        # it, Pass 1 builds on the default docker driver and reuses the host
        # daemon's own build cache, which persists. Pass 2 (the only multi-arch
        # step) needs this builder but is already act-skipped.
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Pass 1: Build test image (amd64 only, load to docker daemon)'
        id: build_test
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            CHROMIUM_VERSION=${{ matrix.chromium_version }}
          tags: test-runner:php${{ matrix.php_version }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      - name: Prepare environment file
        # codeception.yml declares `params: - .env`, and .env is gitignored, so
        # a fresh checkout has none. Mirrors the test-suite workflow.
        run: cp .env.example .env

      - name: Install PHP dependencies in test image
        # Must precede the bootstrap: resources/install.sh copies the SQLite
        # drop-in from public/packages/plugins/sqlite-database-integration/ and
        # resolves WP-CLI through `composer exec`, both of which Composer
        # materialises. The named volume persists Composer's download cache
        # (COMPOSER_HOME) across runs, since the container itself is removed
        # (--rm). Keyed per PHP version so parallel matrix legs don't contend
        # on one cache.
        run: docker run --rm -v "$PWD:/var/www/html" -v "aztec-wp-browser-composer-php${{ matrix.php_version }}:/tmp/composer" -w /var/www/html test-runner:php${{ matrix.php_version }} composer update --no-progress --prefer-dist

      - name: Bootstrap WordPress in test image
        run: docker run --rm -v "$PWD:/var/www/html" -w /var/www/html test-runner:php${{ matrix.php_version }} bash resources/install.sh

      - name: Build Codeception actors in test image
        # tests/_support/_generated/ is gitignored, so the actor classes must be
        # regenerated before the suite can run.
        run: docker run --rm -v "$PWD:/var/www/html" -w /var/www/html test-runner:php${{ matrix.php_version }} codecept build

      - name: Run acceptance tests
        run: docker run --rm -v "$PWD:/var/www/html" -w /var/www/html test-runner:php${{ matrix.php_version }} codecept run acceptance

      - name: 'Pass 2: Build and push (amd64 + arm64, only if tests passed)'
        id: build
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            CHROMIUM_VERSION=${{ matrix.chromium_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:php${{ matrix.php_version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.content_version.outputs.value }}-php${{ matrix.php_version }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # A scheduled run has no one watching it: this workflow accumulated thirteen
  # silent failures before anyone noticed the image was never published. Open an
  # issue on failure so the next regression surfaces on its own. Manual runs are
  # excluded — whoever dispatched them is already looking at the result.
  notify:
    needs: build
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # A job-level `permissions:` block replaces the workflow-level one instead of
    # extending it, so `contents: read` has to be restated here. Without it the
    # job runs on `issues: write` alone, and the GraphQL query behind
    # `gh issue list` fails at the one moment the notification matters.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Scheduled runner image build is failing
        run: |
          # One issue for the whole outage, not one per week. The search is
          # fuzzy, so the exact title comparison is what actually selects it.
          existing="$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
            exit 0
          fi

          cat > issue-body.md <<BODY
          The weekly build of the test runner image failed. While it keeps failing the
          published image is never refreshed, so continuous integration and every
          developer machine stay on the last image that was published.

          Failed run: $RUN_URL

          Every later failure is added to this issue as a comment. Close it once a
          build goes green.
          BODY

          gh issue create --title "$TITLE" --body-file issue-body.md
